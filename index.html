<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📝 Minha Lista de Tarefas</h1>
        <div class="input-container">
            <input type="text" id="todo-input" placeholder="Adicionar nova tarefa..." aria-label="Nova tarefa">
            <button id="add-btn" aria-label="Adicionar tarefa">Adicionar</button>
        </div>
        <ul id="todo-list"></ul>
        <div class="footer">
            <span id="task-count">0 tarefas</span>
            <button id="clear-completed" aria-label="Limpar tarefas concluídas">Limpar concluídas</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
